    label: H100/H200 canonical BF16 TP-1
    enabled: true
    expected_gpu: NVIDIA H100 80GB HBM3
    gpu_count: 1
    server:
      tensor_parallel_size: 1
      boundary_ratio: 0.875
      flow_shift: 5.0
      cache_backend: none
    request_overrides: {}

