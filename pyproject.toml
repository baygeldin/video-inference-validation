[project]
name = "video-inference-validation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "safetensors>=0.4.5",
]

[project.scripts]
viv = "viv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viv"]
